<script id="gmaps-api" src="https://maps.googleapis.com/maps/api/js?key={{custom_values.google_maps_api_key}}&loading=async&libraries=places"></script>
<script defer id="forms-gmaps-address-autocomplete">
    // Source: https://github.com/cliffordp/ghl-customizations/tree/main/gmaps-address-autocomplete-forms
    (function() {
        // console.log("Script loaded");
        let addressData = {
            address: '',
            city: '',
            state: '',
            postal_code: '',
            latitude: '',
            longitude: ''
        };

        function initAutocomplete() {
            // console.log("Initializing Autocomplete");
            let querySelector = '#form-builder input[data-q="address"]';

            // Attach Places API (New) suggestions to the existing form input (keeps GHL's input + Vue bindings intact)
            function createPlacesAutocomplete(inputElement, onPlaceSelected) {
                const { AutocompleteSuggestion, AutocompleteSessionToken } = google.maps.places;

                if (!document.getElementById('tk-gmaps-pac-style')) {
                    const styleEl = document.createElement('style');
                    styleEl.id = 'tk-gmaps-pac-style';
                    styleEl.textContent = [
                        '.tk-pac-container { position: fixed; z-index: 2147483647; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15); font-family: inherit; font-size: 14px; overflow: hidden; }',
                        '.tk-pac-container[hidden] { display: none !important; }',
                        '.tk-pac-item { padding: 8px 12px; cursor: pointer; line-height: 1.3; border-top: 1px solid #f3f4f6; }',
                        '.tk-pac-item:first-child { border-top: 0; }',
                        '.tk-pac-item:hover, .tk-pac-item-selected { background: #f3f4f6; }',
                        '.tk-pac-item-secondary { color: #6b7280; margin-left: 6px; font-size: 12px; }',
                        '.tk-pac-logo { padding: 4px 12px; text-align: right; color: #6b7280; font-size: 11px; border-top: 1px solid #f3f4f6; }'
                    ].join('\n');
                    document.head.appendChild(styleEl);
                }

                const container = document.createElement('div');
                container.className = 'tk-pac-container';
                container.setAttribute('role', 'listbox');
                container.hidden = true;
                document.body.appendChild(container);

                let sessionToken = null;
                let suggestions = [];
                let activeIndex = -1;
                let requestId = 0;
                let inputTimer = null;

                const position = () => {
                    if (container.hidden) return;
                    const rect = inputElement.getBoundingClientRect();
                    container.style.top = `${rect.bottom + 2}px`;
                    container.style.left = `${rect.left}px`;
                    container.style.width = `${rect.width}px`;
                };
                const hide = () => {
                    container.hidden = true;
                    activeIndex = -1;
                };
                const select = async (index) => {
                    const suggestion = suggestions[index];
                    if (!suggestion) return;
                    hide();
                    suggestions = [];
                    requestId++;
                    try {
                        const place = suggestion.placePrediction.toPlace();
                        await place.fetchFields({ fields: ['addressComponents', 'location'] });
                        sessionToken = null; // Session ends after fetchFields (billing)
                        onPlaceSelected(place);
                    } catch (error) {
                        console.error('Error fetching place details:', error);
                    }
                };
                const render = () => {
                    container.replaceChildren();
                    if (!suggestions.length) {
                        hide();
                        return;
                    }
                    suggestions.forEach((suggestion, index) => {
                        const prediction = suggestion.placePrediction;
                        const item = document.createElement('div');
                        item.className = 'tk-pac-item' + (index === activeIndex ? ' tk-pac-item-selected' : '');
                        item.setAttribute('role', 'option');
                        const main = document.createElement('span');
                        main.textContent = String(prediction.mainText || prediction.text || '');
                        item.appendChild(main);
                        if (prediction.secondaryText) {
                            const secondary = document.createElement('span');
                            secondary.className = 'tk-pac-item-secondary';
                            secondary.textContent = String(prediction.secondaryText);
                            item.appendChild(secondary);
                        }
                        item.addEventListener('click', () => select(index));
                        container.appendChild(item);
                    });
                    // Google requires attribution when predictions aren't shown on a Google map
                    const logo = document.createElement('div');
                    logo.className = 'tk-pac-logo';
                    logo.textContent = 'powered by Google';
                    container.appendChild(logo);
                    container.hidden = false;
                    position();
                };
                const fetchSuggestions = async (value) => {
                    const thisRequest = ++requestId;
                    if (!value.trim()) {
                        suggestions = [];
                        hide();
                        return;
                    }
                    if (!sessionToken) {
                        sessionToken = new AutocompleteSessionToken();
                    }
                    try {
                        const response = await AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: value, sessionToken });
                        if (thisRequest !== requestId) return;
                        suggestions = (response.suggestions || []).filter(suggestion => suggestion.placePrediction);
                        activeIndex = -1;
                        render();
                    } catch (error) {
                        console.error('Error fetching autocomplete suggestions (is Places API (New) enabled?):', error);
                    }
                };

                inputElement.setAttribute('autocomplete', 'off');
                inputElement.addEventListener('input', (event) => {
                    if (!event.isTrusted) return; // Ignore our own synthetic input events
                    clearTimeout(inputTimer);
                    inputTimer = setTimeout(() => fetchSuggestions(inputElement.value || ''), 200);
                });
                inputElement.addEventListener('keydown', (event) => {
                    if (container.hidden || !suggestions.length) return;
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        activeIndex = (activeIndex + 1) % suggestions.length;
                        render();
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        activeIndex = activeIndex <= 0 ? suggestions.length - 1 : activeIndex - 1;
                        render();
                    } else if (event.key === 'Enter' && activeIndex >= 0) {
                        event.preventDefault(); // Don't submit the form
                        select(activeIndex);
                    } else if (event.key === 'Escape') {
                        hide();
                    }
                });
                inputElement.addEventListener('blur', () => setTimeout(hide, 150));
                container.addEventListener('mousedown', (event) => event.preventDefault()); // Keep focus in input
                window.addEventListener('scroll', position, true);
                window.addEventListener('resize', position);
            }

            function attachAutocompleteToElement(querySelector) {
                // console.log("Attaching autocomplete to element");
                let inputElement = document.querySelector(querySelector);
                if (inputElement) {
                    // console.log("Input element found:", inputElement);
                    createPlacesAutocomplete(inputElement, function(place) {
                        // console.log("Place selected");
                        let streetNumber = '';
                        let streetName = '';
                        let addressLine2 = '';
                        let city = '';
                        let state = '';
                        let zipcode = '';
                        let latitude = '';
                        let longitude = '';

                        (place.addressComponents || []).forEach(component => {
                            switch (component.types[0]) {
                                case 'street_number':
                                    streetNumber = component.longText;
                                    break;
                                case 'route':
                                    streetName = component.longText;
                                    break;
                                case 'sublocality_level_1':
                                case 'subpremise':
                                    addressLine2 = component.longText;
                                    break;
                                case 'locality':
                                case 'administrative_area_level_3':
                                    city = component.longText;
                                    break;
                                case 'administrative_area_level_1':
                                    state = component.shortText;
                                    break;
                                case 'postal_code':
                                    zipcode = component.longText;
                                    break;
                            }
                        });

                        if (place.location) {
                            latitude = place.location.lat();
                            longitude = place.location.lng();
                        }

                        addressData = {
                            address: `${streetNumber} ${streetName}${addressLine2 ? ', ' + addressLine2 : ''}`,
                            city: city,
                            state: state,
                            postal_code: zipcode,
                            latitude: latitude,
                            longitude: longitude
                        };

                        updateFormFields(addressData);
                    });
                } else {
                    console.error("Element with selector " + querySelector + " not found.");
                }
            }

            function updateFormFields(data) {
                function setValueAndTriggerEvent(input, value) {
                    if (input) {
                        input.value = value;
                        const event = new Event('input', { bubbles: true });
                        input.dispatchEvent(event);
                    }
                }

                setValueAndTriggerEvent(document.querySelector('#form-builder input[data-q="address"]'), data.address);
                setValueAndTriggerEvent(document.querySelector('#form-builder input[data-q="city"]'), data.city);
                setValueAndTriggerEvent(document.querySelector('#form-builder input[data-q="state"]'), data.state);
                setValueAndTriggerEvent(document.querySelector('#form-builder input[data-q="postal_code"]'), data.postal_code);
                setValueAndTriggerEvent(document.querySelector('#form-builder input[data-q="latitude"]'), data.latitude);
                setValueAndTriggerEvent(document.querySelector('#form-builder input[data-q="longitude"]'), data.longitude);

                // Trigger a custom event to update formFieldsValue in Vue component
                const formFieldsValueEvent = new CustomEvent('updateFormFieldsValue', { detail: data });
                document.dispatchEvent(formFieldsValueEvent);
            }

            function checkGoogleMapsLoaded() {
                if (typeof google !== 'undefined' && typeof google.maps !== 'undefined' && typeof google.maps.places !== 'undefined' && typeof google.maps.places.AutocompleteSuggestion === 'function') {
                    // console.log("Google Maps API loaded.");
                    attachAutocompleteToElement(querySelector);
                } else {
                    // console.log("Google Maps API not loaded. Retrying in 500ms...");
                    setTimeout(checkGoogleMapsLoaded, 500);
                }
            }

            checkGoogleMapsLoaded();
        }

        // Hook into the form's internal methods
        const originalMethod = window.fillDataForStandardFieldUri;
        window.fillDataForStandardFieldUri = function(...args) {
            originalMethod.apply(this, args);

            // Restore address data after form updates
            if (addressData.address) {
                updateFormFields(addressData);
            }
        };

        // MutationObserver to watch for the address input field
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length > 0) {
                    // console.log("DOM mutation detected, checking for address input...");
                    const addressInput = document.querySelector('#form-builder input[data-q="address"]');
                    if (addressInput) {
                        // console.log("Address input found, initializing autocomplete");
                        observer.disconnect(); // Stop observing once the input is found
                        initAutocomplete();
                    }
                }
            });
        });

        // Start observing the document body for added nodes
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        // Check if the element already exists on page load
        const addressInput = document.querySelector('#form-builder input[data-q="address"]');
        if (addressInput) {
            observer.disconnect();
            initAutocomplete();
        }

        // Hide the specified fields
        function hideFields() {
            const fieldsToHide = ['state', 'latitude', 'longitude'];
            fieldsToHide.forEach(fieldName => {
                const field = document.querySelector(`#form-builder input[data-q="${fieldName}"]`);
                if (field) {
                    const container = field.closest('.form-field-container');
                    if (container) {
                        container.style.display = 'none';
                    }
                }
            });
        }

        // Ensure fields are hidden after the page is loaded
        waitForModuleLoading(hideFields);

        // Helper function to wait until the page is fully loaded
        function waitForModuleLoading(callback) {
            if (document.readyState === 'complete') {
                callback();
            } else {
                window.addEventListener('load', callback);
            }
        }
    })();
</script>
